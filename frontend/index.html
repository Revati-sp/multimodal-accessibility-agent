<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AccessPilot — UI mock</title><style>body{font:1rem system-ui;max-width:48rem;margin:auto;padding:2rem;line-height:1.6;color:#17324d;background:#f7fafc}button,input{font:inherit}input{width:100%;padding:.6rem}button{margin:.5rem .5rem .5rem 0;padding:.6rem 1rem}section{background:white;border:1px solid #cddae4;border-radius:.6rem;padding:1.5rem}button:focus,input:focus{outline:3px solid #1b78b4}small{color:#465c6f}</style></head><body><main><h1>AccessPilot</h1><p><strong>Static design mock — no task will run.</strong></p><section aria-labelledby="task"><h2 id="task">New task</h2><label for="instruction">Describe your digital task</label><input id="instruction" value="Add my assignment deadline to the calendar" readonly><p><small>Voice capture, task submission and status updates are not wired yet.</small></p><button type="button" disabled>Start task (not connected)</button></section><section aria-labelledby="progress"><h2 id="progress">Task progress example</h2><ol><li>Read deadline — pending</li><li>Create reminder — pending</li><li>Verify saved reminder — pending</li></ol><p role="status" aria-live="polite">No task is running.</p><button type="button" disabled>Pause (not connected)</button><button type="button" disabled>Stop (not connected)</button></section></main></body></html>
